# One address for everything, as on the real site: the page, /v1, the pictures and the sign-in.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  # The page is built for one address (Cognito and the pictures are named by it), so any other name of the
  # same server, such as 127.0.0.1 for localhost, is sent there instead of failing with cross-origin errors.
  if ($http_host != "${PUBLIC_HOST}") {
    return 301 http://${PUBLIC_HOST}$request_uri;
  }

  location /v1/ {
    proxy_pass http://api:3100;
    include /etc/nginx/mock-proxy.conf;
  }

  location /cognito {
    proxy_pass http://api:3100;
    include /etc/nginx/mock-proxy.conf;
  }

  location /mock-storage/ {
    proxy_pass http://api:3100;
    include /etc/nginx/mock-proxy.conf;
  }

  location /media/ {
    proxy_pass http://api:3100;
    include /etc/nginx/mock-proxy.conf;
  }

  # File names under assets/ carry a hash.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Anything else is a route of the application.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
